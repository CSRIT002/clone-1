<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Button Component</title>
    
</head>
<body>
<div class="container">
    <div class="row">
        <h2>Default button</h2>
        <button class="btn">default</button>
    </div>
    <div class="row">
        <h2>Brank button</h2>
        <button class="btn btn-primary">primary</button>
        <button class="btn btn-secondary">secondary</button>
        <button class="btn btn-third">third</button>
        <button class="btn btn-forth">forth</button>
    </div>
        <div class="row">
        <h2>Gold button</h2>
        <button class="btn btn-primaryoutline">primary</button>
        <button class="btn btn-secondaryoutline">secondary</button>
        <button class="btn btn-thirdoutline">third</button>
        <button class="btn btn-forthoutline">forth</button>
    </div>
</div>
</body>
</html>

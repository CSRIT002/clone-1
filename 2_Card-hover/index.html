<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <title>Card Hover</title>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <img
          src="https://images.contentstack.io/v3/assets/bltcedd8dbd5891265b/blt134818d279038650/6668df6434f6fb5cd48aac34/beautiful-flowers-rose.jpeg?q=70&width=3840&auto=webp"
          alt=""
        />
        <div class="overlay">
          <span>I</span>
        </div>
      </div>
      <div class="card">
        <img
          src="https://images.unsplash.com/photo-1530092285049-1c42085fd395?fm=jpg&q=60&w=3000&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8bmF0dXJlJTIwZmxvd2VyfGVufDB8fDB8fHww"
          alt=""
          alt=""
        />
        <div class="overlay">
          <span>Love</span>
        </div>
      </div>
      <div class="card">
        <img
          src="https://images.contentstack.io/v3/assets/bltcedd8dbd5891265b/blt134818d279038650/6668df6434f6fb5cd48aac34/beautiful-flowers-rose.jpeg?q=70&width=3840&auto=webp"
          alt=""
        />
        <div class="overlay">
          <span>You!</span>
        </div>
      </div>

      
      <div class="card">
        <img
          src="https://images.contentstack.io/v3/assets/bltcedd8dbd5891265b/blt5f18c2119ce26485/6668df65db90945e0caf9be6/beautiful-flowers-lotus.jpg?q=70&width=3840&auto=webp"
          alt=""
        />
        <div class="overlay">
          <span>):</span>
        </div>
      </div>
      <div class="card">
        <img
          src="https://images.unsplash.com/photo-1530092285049-1c42085fd395?fm=jpg&q=60&w=3000&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8bmF0dXJlJTIwZmxvd2VyfGVufDB8fDB8fHww"
          alt=""
        />
        <div class="overlay">
          <span>for</span>
        </div>
      </div>
      <div class="card">
        <img
          src="https://images.contentstack.io/v3/assets/bltcedd8dbd5891265b/blt5f18c2119ce26485/6668df65db90945e0caf9be6/beautiful-flowers-lotus.jpg?q=70&width=3840&auto=webp"
          alt=""
        />
        <div class="overlay">
          <span>Over!</span>
        </div>
      </div>

    </div>
  </body>
</html>
